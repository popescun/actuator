name: ci

on:
  push:
  pull_request:

jobs:
  # Formatting is platform independent: the same clang-format version produces
  # the same result everywhere, so this runs once rather than per platform.
  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # A pinned Python keeps pip usable on every runner; the macOS system
      # Python refuses plain `pip install` as an externally managed environment.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned to the same major version used locally. Formatting output differs
      # between clang-format majors, so an unpinned tool fails CI on code that is
      # correctly formatted on a developer's machine.
      - name: Install clang-format
        run: pip install "clang-format>=21,<22"

      - name: Show version
        run: clang-format --version

      # --Werror turns "needs reformatting" into a non-zero exit.
      # git ls-files keeps this to tracked sources, so build trees are never scanned.
      # -z/-0 pairs NUL-separated names, so word splitting never mangles a path.
      - name: Check formatting
        run: |
          echo "checking:"
          git ls-files '*.hpp' '*.cpp' | sed 's/^/  /'
          git ls-files -z '*.hpp' '*.cpp' | xargs -0 clang-format --dry-run --Werror --style=file

  build:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # test/CMakeLists.txt requires CMake 4.1, which is newer than some runner
      # images ship. Installing it via pip pins the same version on all three.
      - name: Install CMake
        run: pip install "cmake>=4.1" ninja

      - name: Show versions
        shell: bash
        run: |
          cmake --version | head -1
          git ls-files '*.hpp' '*.cpp' | wc -l | sed 's/^/tracked sources: /'

      # Ninja does not find MSVC on its own the way the Visual Studio generator does. This runs
      # vcvarsall, so cl.exe and its INCLUDE and LIB reach the steps below. Windows only.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The presets live in test/CMakePresets.json, so cmake --preset is run from there. The release
      # preset builds into test/build-release. No build presets: CLion lists each as a duplicate
      # profile, so Build names the preset's binaryDir.
      - name: Configure
        working-directory: test
        run: cmake --preset release

      - name: Build
        working-directory: test
        run: cmake --build build-release

      # The release test preset carries --output-on-failure and noTestsAction=error: every TEST()
      # is registered by gtest_discover_tests, so an empty suite means discovery failed.
      - name: Test
        working-directory: test
        run: ctest --preset release
